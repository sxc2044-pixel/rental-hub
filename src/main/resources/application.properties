spring.application.name=rental-hub
spring.profiles.default=mysql
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.jackson.time-zone=Asia/Shanghai
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=16
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
rental.upload-dir=${UPLOAD_DIR:./data/uploads}
rental.seed-demo=${SEED_DEMO:false}
rental.catalog-samples=${SEED_CATALOG:false}
logging.file.name=./logs/rental-hub.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB
